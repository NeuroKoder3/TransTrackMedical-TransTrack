version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # Keep the PR queue tiny so Dependabot cannot flood the repo.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    versioning-strategy: increase-if-necessary
    ignore:
      # Never auto-bump majors — review those manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Native / Electron stack — bump only with intentional rebuild + CI.
      - dependency-name: "electron"
      - dependency-name: "electron-builder"
      - dependency-name: "better-sqlite3-multiple-ciphers"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "server"
    commit-message:
      prefix: "deps(server)"
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # otplib v13 is a full rewrite; upgrade only with intentional lockfile work.
      - dependency-name: "otplib"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
