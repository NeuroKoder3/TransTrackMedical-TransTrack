name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Desktop Build & Tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install npm dependencies
        run: npm ci

      # Everything from here to the Electron rebuild below runs against the
      # Node ABI. The suites are invoked through the runner script rather than
      # `npm test` on purpose: the pretest/posttest hooks rebuild the native
      # module for Node and then for Electron, so `npm test` would leave the
      # wrong ABI in place for every step that follows it.
      - name: Rebuild native modules for CI Node version
        run: npm rebuild better-sqlite3-multiple-ciphers

      # scripts/audit-with-exceptions.mjs is the single vulnerability allowlist
      # (finding M-19): it enforces the reviewBy expiry, rejects stale
      # exceptions and rejects a severity increase, none of which the
      # now-removed scripts/production-audit.mjs did.
      - name: Security audit (production dependencies)
        run: node scripts/audit-with-exceptions.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p jsconfig.json --noEmit

      # The compliance-critical suites run first and as their own step so that a
      # control failure is immediately distinguishable in the log from a
      # functional regression. They also run again inside the `all` group below;
      # they are fast, and the ordering is worth the repetition.
      - name: Run security and audit control tests
        run: |
          node scripts/run-test-suites.cjs security
          node scripts/run-test-suites.cjs hardening

      # Every tests/*.test.* file belongs to a group and the runner fails when
      # one belongs to none, so this single step cannot silently stop covering a
      # suite. `all` = security + hardening + functional + performance, which
      # includes the suites that used to be reachable only through bespoke npm
      # scripts (services, ipc-integration, license, secretEncryption,
      # oidcDesktop) and the load test (finding H-8).
      - name: Run all Node test suites
        run: node scripts/run-test-suites.cjs all

      - name: Run component tests with coverage
        run: npx vitest run --coverage

      # Vitest has already enforced the global and per-file floors from
      # scripts/coverage-floor.json at this point. This step re-checks them
      # independently, enforces the ratchet, and writes the job summary. It
      # replaces the inline `hardMin = 19` check with a `::warning::` at 60%
      # that could not fail a build (finding H-8).
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Rebuild for Electron
        run: npx @electron/rebuild -f

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npx cyclonedx-npm --ignore-npm-errors --output-file sbom.json --output-format JSON

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transtrack
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: transtrack_test
        options: >-
          --health-cmd "pg_isready -U transtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://transtrack:ci_test_only@localhost:5432/transtrack_test
      JWT_SECRET: ci-test-secret-at-least-32-bytes-long!!
      NODE_ENV: test
      PGSSL: disable
      HL7_ALLOW_PLAINTEXT: '1'
      HL7_MLLP_TLS_REQUIRE_CLIENT_CERT: 'false'
      REQUIRE_TLS_TERMINATION: 'false'
      MFA_REQUIRED_FOR_ROLES: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint server
        run: npm run lint
        working-directory: server

      # Was `npm audit --production --audit-level=high || true`, a step that
      # could not fail (finding M-18). The server workspace has its own
      # lockfile, so it is audited under its own scope with its own exception
      # records (finding M-19).
      - name: Security audit (server)
        run: node scripts/audit-with-exceptions.mjs --scope=server

      - name: Run database migrations
        run: node src/db/migrate.js up
        working-directory: server

      # These two commands are the blocking coverage for the server-side
      # authorization paths in finding M-28: SMART patient-compartment denial
      # and FHIR transaction bundle scope enforcement
      # (test/unit/patientCompartment.test.mjs) and dead-letter cross-tenant
      # replay (test/unit/hl7Tenancy.test.mjs).
      - name: Run server unit tests
        run: npm test
        working-directory: server

      - name: Run server integration tests
        run: npx vitest run --config vitest.integration.config.mjs
        working-directory: server

      - name: Generate server SBOM
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-server.json --output-format JSON
        working-directory: server

      - name: Upload server SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-server
          path: server/sbom-server.json
          retention-days: 90

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-linux-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f

      - name: Build renderer
        run: npm run build

      - name: Install Playwright Electron dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # The seed step in electron/database/init.cjs reads this env var to
          # provision the first-launch admin password deterministically; the
          # E2E spec reads the same var so the login step doesn't depend on
          # the random setup token written to userData.
          TRANSTRACK_INITIAL_ADMIN_PASSWORD: 'E2E_ONLY_DoNotUseInProd!'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 30

  build-windows:
    name: Windows Build Verification
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3-multiple-ciphers

      - name: Build renderer
        run: npm run build

      - name: Run Node test suites
        run: node scripts/run-test-suites.cjs core

      - name: Build Windows installer
        # Verification only — never publish a GitHub Release from CI (needs GH_TOKEN).
        run: npm run build:win
        env:
          ELECTRON_BUILDER_PUBLISH: never

      # No continue-on-error (finding M-18). This loads the packaged
      # better-sqlite3 binary under the Electron ABI; if it fails, the installer
      # this job just built would crash on first launch at the point where it
      # opens the encrypted database. `npm run build:win` also runs it as its
      # last step, so a build that reached here has already proved the check can
      # execute in this environment — the only thing continue-on-error bought
      # was hiding a genuine failure.
      - name: Verify packaged native module
        run: npm run verify:packaged-native

  # Aggregate gate. Every job above must succeed; this is the single check to
  # require in branch protection. Without it, adding a job to this workflow does
  # not block a merge until somebody remembers to add it to the protection rule,
  # which is how an unenforced gate happens in the first place.
  ci-required:
    name: CI required checks
    runs-on: ubuntu-latest
    needs: [build, server, e2e, build-windows]
    if: always()
    steps:
      - name: Assert every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS);
            for (const [name, job] of Object.entries(results).sort()) {
              console.log(job.result.padStart(12) + "  " + name);
            }
            const failed = Object.entries(results).filter(([, job]) => job.result !== "success");
            if (failed.length > 0) {
              console.error("::error::Required CI jobs did not succeed: " + failed.map(([n]) => n).sort().join(", "));
              process.exit(1);
            }
            console.log("All required CI jobs succeeded.");
          '
